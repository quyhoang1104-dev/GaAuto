# =====================================================================
# Nginx Virtual Host Configuration for GoClaw
# Domain: hoangquy.name.vn, www.hoangquy.name.vn
# Target Gateway: 127.0.0.1:18790
# =====================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP Server Block - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hoangquy.name.vn www.hoangquy.name.vn;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hoangquy.name.vn www.hoangquy.name.vn;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hoangquy.name.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoangquy.name.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Max body size for large document/file uploads into GoClaw Knowledge Vault
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;

        # WebSocket Streaming Support (Critical for GoClaw agent chat & real-time tasks)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket timeouts (prevents dropping long LLM thoughts/tool tasks)
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Streaming optimizations (disable proxy buffering for real-time tokens)
        proxy_buffering off;
        proxy_cache off;
    }
}
